<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="IDMB - Banking, Wallets and Data Analytics Infrastructure">
  <title>IDMB - Banking, Wallets and Data Analytics Infrastructure</title>
  <desc>Modern banking, wallets and data analytics infrastructure for banks, fintechs and operators.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0043ce"/>
      <stop offset="1" stop-color="#0f62fe"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#82cfff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#82cfff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0043ce" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g opacity="0.18" stroke="#ffffff" stroke-width="1" fill="none">
    <path d="M0 540 Q 300 460 600 540 T 1200 540"/>
    <path d="M0 580 Q 300 500 600 580 T 1200 580"/>
    <path d="M0 500 Q 300 420 600 500 T 1200 500"/>
  </g>

  <!-- Logo mark: three white rounded bars matching the favicon (dark-mode variant) -->
  <!-- Bars are proportional to the favicon.svg design (512×512): bar widths 310/430/310, bar2 is widest -->
  <rect x="93"  y="195" width="108" height="30" rx="15" fill="#ffffff"/>
  <rect x="72"  y="255" width="150" height="30" rx="15" fill="#ffffff"/>
  <rect x="93"  y="315" width="108" height="30" rx="15" fill="#ffffff"/>

  <text x="250" y="305" font-family="'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif" font-size="110" font-weight="700" fill="#ffffff" letter-spacing="-3">IDMB</text>

  <text x="72" y="420" font-family="'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif" font-size="56" font-weight="600" fill="#ffffff" letter-spacing="-1.5">
    <tspan x="72" dy="0">Banking. Wallets.</tspan>
    <tspan x="72" dy="68">Data analytics.</tspan>
  </text>

  <text x="72" y="555" font-family="'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="400" fill="#c6e1ff">
    The infrastructure layer for modern finance — APIs and managed services for banks, fintechs and operators.
  </text>

  <g transform="translate(72,590)">
    <rect width="220" height="2" fill="url(#rail)"/>
  </g>

  <text x="1128" y="610" text-anchor="end" font-family="'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="500" fill="#ffffff" opacity="0.85">idm-b.com</text>
</svg>
